services:
  - type: web
    name: breal
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: breal-data
      mountPath: /data
      sizeGB: 1
